name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Daily rebuild so future-dated articles in src/articles/ publish
    # automatically on their scheduled date (see README "cadence" note).
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build site
        run: node build.mjs
      - name: Add .nojekyll
        run: touch docs/.nojekyll
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs
          publish_branch: gh-pages
